<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Photo vault</title>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<main>
  <div class="wrap">
    <div id="lock" class="card lock" hidden>
      <div style="font-size:2.2rem">&#128274;</div>
      <h2>League photo vault</h2>
      <p class="note">These photos are encrypted. Enter the league password to view them.</p>
      <form id="form" autocomplete="off">
        <input type="password" id="pw" placeholder="Password" autocomplete="current-password" aria-label="Password" required>
        <button class="btn" id="go" type="submit">Unlock</button>
      </form>
      <p id="msg" class="note" role="alert" style="min-height:1.4em;margin:10px 0 0"></p>
    </div>
    <div id="empty" class="card pad" hidden><p>No photos have been added to the vault yet.</p></div>
    <div id="gallery" hidden></div>
  </div>
</main>
<div class="lightbox" id="lb" aria-modal="true" role="dialog">
  <button class="x" id="lbx" aria-label="Close">&times;</button>
  <button class="nav-btn prev" id="lbp" aria-label="Previous">&#8249;</button>
  <img id="lbi" alt="">
  <div class="lb-cap" id="lbc"></div>
  <button class="nav-btn next" id="lbn" aria-label="Next">&#8250;</button>
</div>
<script src="assets/site.js"></script>
<script>
L.boot("photos.html", "Photo vault", async (meta) => {
  const { $, $$, esc, getJSON } = L;
  $("#pageSub").textContent = "Members only · photos are decrypted in your browser and never leave this device";
  const te = new TextEncoder(), td = new TextDecoder();
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  let vault;
  try { vault = await getJSON("private/vault.json"); } catch (e) { $("#empty").hidden = false; return; }
  if (!window.crypto || !crypto.subtle) {
    $("#lock").hidden = false;
    $("#msg").textContent = "This page needs a secure (https) connection to decrypt photos.";
    $("#go").disabled = true; return;
  }
  $("#lock").hidden = false;

  async function deriveKey(pw) {
    const base = await crypto.subtle.importKey("raw", te.encode(pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(vault.salt), iterations: vault.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  }
  const decrypt = (key, bytes) => crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes.slice(0, 12) }, key, bytes.slice(12));
  async function fetchBytes(path) {
    const r = await fetch(path);
    if (!r.ok) throw new Error(path + " " + r.status);
    return new Uint8Array(await r.arrayBuffer());
  }

  let key = null, items = [];
  $("#form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    $("#msg").textContent = "Unlocking…"; $("#go").disabled = true;
    try {
      const k = await deriveKey($("#pw").value);
      const plain = await decrypt(k, b64(vault.data));
      items = JSON.parse(td.decode(plain)); key = k;
    } catch (e) {
      $("#msg").textContent = "That password did not work."; $("#go").disabled = false; $("#pw").select(); return;
    }
    $("#pw").value = ""; $("#lock").hidden = true; show();
  });

  const urlCache = {};
  async function blobUrl(path) {
    if (urlCache[path]) return urlCache[path];
    const bytes = await decrypt(key, await fetchBytes(path));
    return (urlCache[path] = URL.createObjectURL(new Blob([bytes], { type: "image/jpeg" })));
  }

  function show() {
    if (!items.length) { $("#empty").hidden = false; return; }
    items.sort((a, b) => (b.year || 0) - (a.year || 0) || String(a.caption).localeCompare(String(b.caption)));
    const groups = new Map();
    items.forEach((it, i) => { it.i = i; const y = it.year || "Other"; if (!groups.has(y)) groups.set(y, []); groups.get(y).push(it); });
    $("#gallery").innerHTML = Array.from(groups.entries()).map(([y, list]) =>
      '<section><h2 class="sec-title">' + y + " <small>" + list.length + (list.length === 1 ? " photo" : " photos") + '</small></h2><div class="thumbs">' +
      list.map((it) => '<div class="thumb" data-i="' + it.i + '" tabindex="0" role="button" aria-label="' + esc(it.caption || "Open photo") + '"><img alt="' + esc(it.caption || "") + '">' +
        (it.caption ? '<div class="cap">' + esc(it.caption) + "</div>" : "") + "</div>").join("") + "</div></section>").join("");
    $("#gallery").hidden = false;
    // decrypt thumbnails a few at a time
    const queue = $$(".thumb", $("#gallery")); let busy = 0;
    (function pump() {
      while (busy < 4 && queue.length) {
        const el = queue.shift(); busy++;
        blobUrl("private/" + items[+el.dataset.i].id + ".t.enc").then((u) => { $("img", el).src = u; }).catch(() => {}).finally(() => { busy--; pump(); });
      }
    })();
    $$(".thumb", $("#gallery")).forEach((el) => {
      el.addEventListener("click", () => open(+el.dataset.i));
      el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(+el.dataset.i); } });
    });
  }

  let cur = 0;
  async function open(i) {
    cur = (i + items.length) % items.length;
    const it = items[cur];
    $("#lb").classList.add("open");
    $("#lbc").textContent = [it.year, it.caption].filter(Boolean).join(" · ");
    $("#lbi").removeAttribute("src");
    try { $("#lbi").src = await blobUrl("private/" + it.id + ".enc"); } catch (e) { $("#lbc").textContent = "Could not load this photo."; }
  }
  const close = () => $("#lb").classList.remove("open");
  $("#lbx").addEventListener("click", close);
  $("#lbp").addEventListener("click", () => open(cur - 1));
  $("#lbn").addEventListener("click", () => open(cur + 1));
  $("#lb").addEventListener("click", (e) => { if (e.target === $("#lb")) close(); });
  document.addEventListener("keydown", (e) => {
    if (!$("#lb").classList.contains("open")) return;
    if (e.key === "Escape") close(); else if (e.key === "ArrowLeft") open(cur - 1); else if (e.key === "ArrowRight") open(cur + 1);
  });
});
</script>
</body>
</html>
